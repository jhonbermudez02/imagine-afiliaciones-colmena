services:
  imagine_qdrant:
    image: qdrant/qdrant:latest
    container_name: imagine_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - imagine_net

  imagine_db:
    image: postgres:15-alpine
    container_name: imagine_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afi_pass}
      POSTGRES_DB: ${POSTGRES_DB:-afiliaciones}
    ports:
      - "5432:5432"
    volumes:
      - imagine_postgres_data:/var/lib/postgresql/data
    networks:
      - imagine_net

  imagine_compat_db:
    image: postgres:15-alpine
    container_name: imagine_compat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${COMPAT_POSTGRES_USER:-escobar}
      POSTGRES_PASSWORD: ${COMPAT_POSTGRES_PASSWORD:-escobar}
      POSTGRES_DB: ${COMPAT_POSTGRES_DB:-postgres}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPAT_POSTGRES_USER:-escobar} -d ${COMPAT_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - imagine_compat_postgres_data:/var/lib/postgresql/data
      - ./compat-db/init:/docker-entrypoint-initdb.d:ro
      - ./files_migration/schemassql/pqr_colmena:/pqr_seed:ro
    networks:
      - imagine_net

  # SQL Server LOCAL, suplente del servidor real mientras no haya acceso a el.
  # Misma logica que imagine_compat_db: una reproduccion para trabajar en local, NO un
  # destino de despliegue. Cuando llegue la conexion real solo cambia
  # DB_ALIAS_SR03EPSDB_URL; el codigo no se entera porque todo pasa por el alias.
  # La imagen de Microsoft trae licencia Developer (gratuita para desarrollo y pruebas).
  imagine_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: imagine_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-Imagine_Local_2026}
      MSSQL_PID: Developer
    ports:
      # 1434 en el host para no chocar con un SQL Server instalado en la maquina.
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - imagine_sqlserver_data:/var/opt/mssql
    networks:
      - imagine_net

  imagine_compat_backend:
    build:
      context: ./compat-backend
      dockerfile: Dockerfile
    container_name: imagine_compat_backend
    restart: unless-stopped
    depends_on:
      imagine_compat_db:
        condition: service_healthy
    environment:
      APP_PROFILE: afiliaciones
      DATABASE_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/temporal
      DB_ALIAS_TEMPORAL_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/temporal
      DB_ALIAS_WIMG004_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/img004
      DB_ALIAS_YBR_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/br
      DB_ALIAS_PQR_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/pqr_colmena
      # SQL Server. El ALIAS se llama SR03EPSDB (servidor SR03) pero la BASE es EPSDB.
      # Apunta al contenedor local; para el servidor real basta con cambiar
      # host, base y credenciales aqui (o via .env). TrustServerCertificate=yes porque el
      # contenedor usa un certificado autofirmado -y el Driver 18 cifra por omision-;
      # contra el servidor real, quitalo si su certificado es de una CA de confianza.
      DB_ALIAS_SR03EPSDB_URL: ${DB_ALIAS_SR03EPSDB_URL:-mssql+pyodbc://sa:${SQLSERVER_SA_PASSWORD:-Imagine_Local_2026}@imagine_sqlserver:1433/EPSDB?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes}
      AFILIACIONES_ENGINE_STATE_PATH: /tmp/afiliaciones_engine_state.json
      AI_RAG_BACKEND: postgres
      AI_RAG_DB_ALIAS: temporal
      AI_RAG_DB_TABLE: nova_rag_chunks
      AI_MASK_SENSITIVE: "false"
      AI_REQUIRE_REAL_DATA: "false"
      LLM_PROVIDER: openai-compatible
      LLM_BASE_URL: http://host.docker.internal:1234/v1
      LLM_API_KEY: lm-studio
      LLM_MODEL: google/gemma-3-4b:2
      LLM_EMBED_MODEL: ""
      LEGACY_IMG_EXPECTED_NDISCO: ${LEGACY_IMG_EXPECTED_NDISCO:-img10}
    ports:
      - "8011:8000"
    volumes:
      - ./shared_downloads:/host_downloads:ro
      - ${LEGACY_IMG_HOST_MOUNT:-/img10}:/legacy_share
    networks:
      - imagine_net

  imagine_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imagine_backend
    restart: unless-stopped
    depends_on:
      - imagine_qdrant
      - imagine_db
      - imagine_compat_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-afi_user}:${POSTGRES_PASSWORD:-afi_pass}@imagine_db:5432/${POSTGRES_DB:-afiliaciones}
      QDRANT_URL: http://imagine_qdrant:6333
      MODEL_NAME: ${MODEL_NAME:-local-deterministic}
      USE_LOCAL_EMBED: "true"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-hash-embedding-v1}
      RERANKER_ENABLED: "false"
      KNOWLEDGE_DIR: /data/knowledge
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-true}
      NOTIFICATION_SENDER_EMAIL: ${NOTIFICATION_SENDER_EMAIL:-hdescobarmesa@gmail.com}
      NOTIFICATION_SENDER_NAME: ${NOTIFICATION_SENDER_NAME:-Imagine S.A.S.}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      LEGACY_PROJECT_ROOT: /compat-backend
      LEGACY_BACKEND_URL: http://imagine_compat_backend:8000/api/v1/afiliaciones
      # Ingreso desde el portal Yii. Vacio deshabilita /sso/yii.
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:-}
      SSO_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-true}
      MANUAL_LOGIN_ENABLED: ${MANUAL_LOGIN_ENABLED:-true}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./compat-backend:/compat-backend:ro
    networks:
      - imagine_net

  imagine_frontend:
    build:
      context: ./frontend-nova
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: imagine_frontend
    restart: unless-stopped
    depends_on:
      - imagine_backend
    ports:
      - "8105:80"
    networks:
      - imagine_net

volumes:
  imagine_postgres_data:
  imagine_compat_postgres_data:
  imagine_sqlserver_data:

networks:
  imagine_net:
    driver: bridge
