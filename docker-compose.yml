services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: afi_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    platform: linux/arm64
    networks:                 # ← AGREGAR
      - afi_network           # ← AGREGAR

  frontend-nova:
    image: node:18-alpine
    container_name: afi_frontend_nova
    working_dir: /app
    volumes:
      - ./frontend-nova:/app
    ports:
      - "8105:8105"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 8105 --strictPort"
    restart: unless-stopped
    networks:                 # ← AGREGAR
      - afi_network           # ← AGREGAR

  postgres:
    image: postgres:15-alpine
    container_name: afi_postgres
    environment:
      POSTGRES_USER: afi_user
      POSTGRES_PASSWORD: afi_pass
      POSTGRES_DB: afiliaciones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:                 # ← AGREGAR
      - afi_network           # ← AGREGAR

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afi_backend
    depends_on:
      - qdrant
      - postgres
    environment:
      - DATABASE_URL=postgresql://afi_user:afi_pass@postgres:5432/afiliaciones
      - QDRANT_URL=http://qdrant:6333
      - MODEL_NAME=local-deterministic
      - EMBEDDING_MODEL=local-hash-embedding-v1
      - USE_LOCAL_EMBED=true
      - RERANKER_ENABLED=false
      - KNOWLEDGE_DIR=/data/knowledge
      - NOTIFICATION_ENABLED=${NOTIFICATION_ENABLED:-true}
      - NOTIFICATION_SENDER_EMAIL=${NOTIFICATION_SENDER_EMAIL:-hdescobarmesa@gmail.com}
      - NOTIFICATION_SENDER_NAME=${NOTIFICATION_SENDER_NAME:-Imagine S.A.S.}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:                 # ← AGREGAR
      - afi_network           # ← AGREGAR

networks:
  afi_network:
    driver: bridge

volumes:
  postgres_data:
