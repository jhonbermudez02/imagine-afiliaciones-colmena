services:
  imagine_qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - imagine_qdrant_data:/qdrant/storage
    networks:
      - imagine_net

  imagine_db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afi_pass}
      POSTGRES_DB: ${POSTGRES_DB:-afiliaciones}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afi_user} -d ${POSTGRES_DB:-afiliaciones}"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - imagine_net

  imagine_compat_db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${COMPAT_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${COMPAT_POSTGRES_USER:-escobar}
      POSTGRES_PASSWORD: ${COMPAT_POSTGRES_PASSWORD:-escobar}
      POSTGRES_DB: ${COMPAT_POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPAT_POSTGRES_USER:-escobar} -d ${COMPAT_POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - imagine_compat_postgres_data:/var/lib/postgresql/data
      - ./compat-db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - imagine_net

  imagine_compat_backend:
    build:
      context: ./compat-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      imagine_compat_db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_PROFILE: afiliaciones
      DATABASE_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/temporal
      DB_ALIAS_TEMPORAL_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/temporal
      DB_ALIAS_WIMG004_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/img004
      DB_ALIAS_YBR_URL: postgresql+psycopg2://${COMPAT_POSTGRES_USER:-escobar}:${COMPAT_POSTGRES_PASSWORD:-escobar}@imagine_compat_db:5432/br
      AFILIACIONES_ENGINE_STATE_PATH: /tmp/afiliaciones_engine_state.json
      AI_RAG_BACKEND: postgres
      AI_RAG_DB_ALIAS: temporal
      AI_RAG_DB_TABLE: nova_rag_chunks
      AI_MASK_SENSITIVE: "false"
      AI_REQUIRE_REAL_DATA: "false"
      LLM_PROVIDER: ${COMPAT_LLM_PROVIDER:-local-deterministic}
      LLM_BASE_URL: ${COMPAT_LLM_BASE_URL:-}
      LLM_API_KEY: ${COMPAT_LLM_API_KEY:-}
      LLM_MODEL: ${COMPAT_LLM_MODEL:-local-model}
      LLM_EMBED_MODEL: ${COMPAT_LLM_EMBED_MODEL:-}
      LEGACY_IMG_EXPECTED_NDISCO: ${LEGACY_IMG_EXPECTED_NDISCO:-img10}
    ports:
      - "${COMPAT_BACKEND_PORT:-8011}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
    volumes:
      - ./shared_downloads:/host_downloads:ro
      - ${LEGACY_IMG_HOST_MOUNT:-/img10}:/legacy_share
    networks:
      - imagine_net

  imagine_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - imagine_qdrant
      - imagine_db
      - imagine_compat_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-afi_user}:${POSTGRES_PASSWORD:-afi_pass}@imagine_db:5432/${POSTGRES_DB:-afiliaciones}
      QDRANT_URL: http://imagine_qdrant:6333
      MODEL_NAME: ${MODEL_NAME:-local-deterministic}
      USE_LOCAL_EMBED: "true"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-local-hash-embedding-v1}
      RERANKER_ENABLED: "false"
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-spa+eng}
      KNOWLEDGE_DIR: /data/knowledge
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      NOTIFICATION_SENDER_EMAIL: ${NOTIFICATION_SENDER_EMAIL:-no-reply@example.com}
      NOTIFICATION_SENDER_NAME: ${NOTIFICATION_SENDER_NAME:-Imagine S.A.S.}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      LEGACY_PROJECT_ROOT: /compat-backend
      LEGACY_BACKEND_URL: http://imagine_compat_backend:8000/api/v1/afiliaciones
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-8105}}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
    volumes:
      - ./data:/data
      - ./compat-backend:/compat-backend:ro
    networks:
      - imagine_net

  imagine_frontend:
    build:
      context: ./frontend-nova
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      imagine_backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8105}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
    networks:
      - imagine_net

volumes:
  imagine_compat_postgres_data:
  imagine_qdrant_data:

networks:
  imagine_net:
    driver: bridge
